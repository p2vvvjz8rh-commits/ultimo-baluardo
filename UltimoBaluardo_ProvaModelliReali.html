<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ultimo Baluardo — Prova modelli reali CC0</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#060d13;color:#eaf4ed;font:14px system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.wrap{position:relative;width:min(100vw,58dvh);height:min(100dvh,172vw);overflow:hidden;background:#101c23;border:1px solid #3c5556;border-radius:12px}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;left:9px;right:9px;top:max(10px,env(safe-area-inset-top));padding:10px;background:#09151ccf;border:1px solid #43605a;border-radius:12px;display:grid;gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{font-size:12px;color:#f4d999;font-weight:900;letter-spacing:.06em}.desc{font-size:11px;color:#c0d3cc}button{background:#1d3c3c;color:#f5f0de;border:1px solid #67887c;border-radius:8px;padding:10px;font-size:12px;font-weight:750;flex:1}button.active{background:#d3b173;border-color:#f1daac;color:#112226}.buttons{display:flex;gap:7px}#status{font-size:11px;color:#b8cbc6;line-height:1.35}.foot{position:absolute;bottom:5px;left:6px;right:6px;text-align:center;font-size:10px;color:#d0d9d6c2;text-shadow:0 1px 2px #000;pointer-events:none}</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head><body><main class="wrap"><canvas id="renderCanvas" aria-label="Scena 3D con modelli reali"></canvas><div class="ui"><div class="top"><span class="title">ULTIMO BALUARDO · PROVA ASSET VERI</span><span style="font-size:11px">CAMERA 8</span></div><div class="buttons"><button class="active" id="crowd">ZOMBIE</button><button id="boss">BOSS</button></div><div id="status">Caricamento dei modelli gratuiti Quaternius…</div></div><div class="foot">Prova visiva • non è il gioco completo • nessun acquisto</div></main>
<script>
(async function(){'use strict';
 const status=document.getElementById('status'),canvas=document.getElementById('renderCanvas');
 if(!window.BABYLON){status.textContent='Impossibile caricare Babylon.js: controlla la connessione.';return;}
 const B=BABYLON,engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,adaptToDeviceRatio:false});engine.setHardwareScalingLevel(Math.max(1,(window.devicePixelRatio||1)/1.6));
 const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.035,.065,.078,1);scene.ambientColor=new B.Color3(.38,.42,.43);scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.exposure=.86;scene.imageProcessingConfiguration.contrast=1.04;
 const camera=new B.FreeCamera('camera',new B.Vector3(0,8,-17.5),scene);camera.setTarget(new B.Vector3(0,1.2,20));camera.fov=.83;camera.minZ=.05;camera.maxZ=180;
 const sky=new B.HemisphericLight('softAmbient',new B.Vector3(0,1,0),scene);sky.intensity=.86;sky.groundColor=new B.Color3(.22,.28,.27);const sun=new B.DirectionalLight('softSun',new B.Vector3(-.5,-1,.2),scene);sun.intensity=.54;
 function mat(name,hex){let m=new B.StandardMaterial(name,scene);m.diffuseColor=B.Color3.FromHexString(hex);m.specularColor=new B.Color3(.08,.08,.08);return m;}
 let road=mat('asfalto','#343c3d'),line=mat('linee','#98875b'),side=mat('lati','#1a2428'),red=mat('punto debole','#ab4b39');
 function box(n,w,h,d,x,y,z,m){let o=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);o.position.set(x,y,z);o.material=m;return o;}
 box('road',10,.12,115,0,-.07,20,road);box('shoulderLeft',3,.1,115,-6.5,-.07,20,side);box('shoulderRight',3,.1,115,6.5,-.07,20,side);
 for(let z=-25;z<79;z+=7)box('line',.095,.012,2,0,.005,z,line);
 for(let z=-22;z<75;z+=7){box('edgeL',.12,.02,3.8,-5,.02,z,line);box('edgeR',.12,.02,3.8,5,.02,z,line)}
 const roadblock=mat('concrete','#71766c');box('barrier',1.4,.65,.48,-3,.33,12,roadblock);
 const barrelMat=mat('barrel','#963a2a');let drum=B.MeshBuilder.CreateCylinder('barile',{diameter:.9,height:1.25,tessellation:18},scene);drum.position.set(3,.63,13);drum.material=barrelMat;
 const band=mat('band','#c7b078');for(let y of [.2,.9]){let ring=B.MeshBuilder.CreateCylinder('barrelBand',{diameter:.92,height:.075,tessellation:18},scene);ring.position.set(3,y,13);ring.material=band;}
 const ROOT='https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Zombie%20Apocalypse%20Kit%20-%20March%202024/Characters/glTF/';
 async function load(n){const result=await B.SceneLoader.ImportMeshAsync('',ROOT,encodeURIComponent(n)+'.gltf',scene);const holder=new B.TransformNode(n+'Holder',scene);const all=[...result.meshes,...result.transformNodes];const allSet=new Set(all);for(const o of all){if(o!==holder&&!o.parent)o.parent=holder;}for(let group of result.animationGroups||[]){group.stop();}return {holder,result};}
 const active=[],soldiers=[];const [sam,basic,chubby,ribcage]=await Promise.allSettled([load('Characters_Sam_SingleWeapon'),load('Zombie_Basic'),load('Zombie_Chubby'),load('Zombie_Ribcage')]);
 const sources=[sam,basic,chubby,ribcage].map(x=>x.status==='fulfilled'?x.value:null);const ok=sources.filter(Boolean).length;
 if(ok===0){status.textContent='Modelli non caricati. Il browser potrebbe bloccare i file esterni: serve una connessione Internet.';return;}
 for(const s of sources){if(s){s.holder.setEnabled(false);}}
 function clone(src,label,x,z,scale=1){if(!src)return null;let copy=src.holder.clone(label,false);copy.position.set(x,.04,z);copy.scaling.scaleInPlace(scale);copy.setEnabled(true);active.push(copy);return copy;}
 if(sources[0])for(let i=-1;i<=1;i++)soldiers.push(clone(sources[0],'soldier'+i,i*1.35,-2,1.05));
 const zombiePositions=[];for(let i=0;i<18;i++){let lane=(i%3-1)*2.25;let z=9+Math.floor(i/3)*3.2;let source=(i%7===0?sources[2]:i%5===0?sources[3]:sources[1])||sources[1]||sources[2];let o=clone(source,'zombie'+i,lane+(i%2?.28:-.28),z,.9);if(o)zombiePositions.push({o,baseZ:z,phase:i*.71});}
 let bossDisplay=null; if(sources[2]){bossDisplay=clone(sources[2],'boss',0,14,2.35);if(bossDisplay)bossDisplay.setEnabled(false);}
 function setMode(mode){document.getElementById('crowd').classList.toggle('active',mode==='crowd');document.getElementById('boss').classList.toggle('active',mode==='boss');for(const z of zombiePositions)z.o.setEnabled(mode==='crowd');if(bossDisplay)bossDisplay.setEnabled(mode==='boss');status.textContent=mode==='crowd'?`Modelli originali caricati: ${ok}/4 · vista con zombie multipli`:`Boss di prova: Zombie_Chubby ingrandito (non è ancora un boss dedicato)`;}
 document.getElementById('crowd').onclick=()=>setMode('crowd');document.getElementById('boss').onclick=()=>setMode('boss');setMode('crowd');
 let tick=0;scene.onBeforeRenderObservable.add(()=>{tick+=engine.getDeltaTime()*.001;for(let z of zombiePositions){z.o.position.z=z.baseZ-((tick*.55+z.phase)%1.65);z.o.rotation.y=Math.sin(tick+z.phase)*.045;}if(bossDisplay)bossDisplay.rotation.y=Math.sin(tick*.7)*.07;});
 engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
})().catch(e=>{console.error(e);let s=document.getElementById('status');if(s)s.textContent='Errore durante la preparazione della scena: '+String(e.message||e).slice(0,110);});
</script></body></html>
