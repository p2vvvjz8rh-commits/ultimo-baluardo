 if(s.muzzleFlash){s.muzzleTimer=.073;s.muzzleFlash.setEnabled(true);}

 let dmg=(1+damageBoost)*(weapon==='shotgun'?.77:weapon==='machinegun'?.70:weapon==='piercing'?1.14:1);
 shots.push({m,vx:Math.sin(angle)*39,vz:Math.cos(angle)*39,kind:'bullet',speed:39,damage:dmg,t:0,hit:new Set(),piercing:weapon==='piercing'});
}

function nextWave(){if(wave>=10){phase='transition';spawnTimer=0;flash('PREPARATI AL BOSS!',1.5);return}wave++;waveClock=0;spawnTimer=0;gateTimer=4;hazardTimer=6;flash('ONDATA '+wave+' / 10',1.5);hud()}
function preBoss(){phase='loadout';disposeGroup(gates);openModal('SCEGLI UN’ARMA','Hai completato le 10 ondate! Scegli gratuitamente l’arma per affrontare Lo Sfondatore. La scelta dura fino alla fine del boss.',[
{label:'FUCILE · EQUILIBRATO',act:()=>beginBoss('rifle')},{label:'FUCILE A POMPA · 3 COLPI',act:()=>beginBoss('shotgun')},{label:'MITRAGLIATRICE · RAPIDA',act:()=>beginBoss('machinegun')},{label:'PERFORANTE · POTENTE',act:()=>beginBoss('piercing')}])}
function beginBoss(w){weapon=w;phase='boss';boss=makeBoss();boss.r.position.z=38;boss.hp=20*(130+35*(level-1));boss.maxhp=boss.hp; /* Boss HP exactly 20x Alpha 3. Visual effects do not change damage. */boss.alive=true;bossTimer=0;chargeTimer=0;hud();flash('LO SFONDATORE!',2);$('hint').textContent='Boss: schiva le cariche! La sua corazza si apre dopo ogni carica.'}
function finishLevel(){phase='shop';disposeGroup(zombies);disposeGroup(gameProps);if(boss){boss.r.dispose();boss=null}let carry=Math.max(1,Math.floor(soldiers.length*.25));openModal('LIVELLO '+level+' COMPLETATO','Hai sconfitto il boss! '+coins+' monete disponibili. Nel prossimo aggiornamento arriverà il negozio completo; per ora conservi le monete e riparti con '+carry+' soldati.',[{label:'LIVELLO SUCCESSIVO',full:true,act:()=>{for(let s of soldiers)s.r.dispose();soldiers=[];level++;wave=1;waveClock=0;spawnTimer=0;gateTimer=3;hazardTimer=6;coinTimer=9;phase='waves';weapon='rifle';damageBoost=0;fireBoost=0;shield=3;desiredX=0;for(let k=0;k<carry;k++)spawnSoldier();hud();flash('LIVELLO '+level,1.4);$('hint').textContent='Nuove ondate · Più zombie · Attraversa le porte'}}])}
function animate(dt){elapsed+=dt;let spd=scrollSpeed*(1+Math.min(.4,(wave-1)*.043));if(phase==='waves'||phase==='transition'||phase==='boss'){animateCityProps(dt,spd);for(const dash of roadDashes){dash.position.z-=spd*dt;if(dash.position.z<-18)dash.position.z+=101.4}}if(flashTime>0){flashTime-=dt;if(flashTime<=0)$('flash').style.opacity='0'}if(gateChoiceLock>0)gateChoiceLock-=dt;positionSquad(dt);
for(let i=0;i<soldiers.length;i++){let s=soldiers[i],t=elapsed*8.6+i*.4;s.legL.rotation.x=Math.sin(t)*.24;s.legR.rotation.x=-Math.sin(t)*.24;s.body.position.y=Math.abs(Math.sin(t))*.05;s.armL.rotation.z=.03+.035*Math.sin(t);s.armR.rotation.z=-.03-.035*Math.sin(t);s.armL.rotation.x=.13+.10*Math.sin(t*.72);s.armR.rotation.x=.13-.10*Math.sin(t*.72);s.body.rotation.z=Math.sin(t*.5)*.012;
 if(s.muzzleTimer>0){s.muzzleTimer-=dt;if(s.muzzleTimer<=0)s.muzzleFlash.setEnabled(false)}
 }
if(phase==='waves'){waveClock+=dt;spawnTimer+=dt;gateTimer+=dt;hazardTimer+=dt;coinTimer+=dt;let interval=Math.max(.78,1.5-(wave-1)*.075-(level-1)*.035);if(spawnTimer>interval){spawnTimer-=interval;spawnHorde()}if(gateTimer>15.5){gateTimer=0;spawnDoorPair()}if(hazardTimer>9.2){hazardTimer=0;spawnObstacle()}if(coinTimer>22){coinTimer=0;spawnCoin()}if(waveClock>=waveDuration){if(wave<10)nextWave();else{phase='transition';flash('ULTIMA ONDATA SUPERATA',1.5)}}}
if(phase==='transition'){if(zombies.some(z=>z.alive)||gates.length||gameProps.some(x=>x.type==='obstacle'&&!x.dead)){// clear the last stragglers by continued movement
}else preBoss()}
if(phase==='boss'&&boss&&boss.alive){bossTimer+=dt;chargeTimer+=dt;boss.phase+=dt;boss.r.position.z-=dt*(chargeTimer>6.5&&chargeTimer<8.0?12:.35);boss.r.position.x+=(desiredX-boss.r.position.x)*Math.min(1,dt*(chargeTimer>6.5?3:.35));boss.core.position.y=Math.sin(bossTimer*3)*.08;boss.head.rotation.z=Math.sin(bossTimer*1.3)*.06;boss.core.rotation.z=Math.sin(bossTimer*.9)*.025;
 if(boss.hitFlash>0){boss.hitFlash=Math.max(0,boss.hitFlash-dt);boss.core.rotation.x=-boss.hitFlash*.28;boss.core.scaling.setAll(1+boss.hitFlash*.16)}
 else {boss.core.rotation.x=0;boss.core.scaling.setAll(1)}
 for(let [i,a] of boss.arms.entries())a.rotation.z=(i===0?-.17:.17)+Math.sin(bossTimer*2+i)*.12;if(chargeTimer>9){chargeTimer=0;boss.r.position.z=29;flash('CARICA IN ARRIVO!',1.25)}if(chargeTimer>5.3&&chargeTimer<5.36)flash('SCHIVA! CARICA!',.9);if(boss.r.position.z<-1.5){if(Math.abs(boss.r.position.x-desiredX)<2.1&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=1.2}boss.r.position.z=25;chargeTimer=0;flash('PUNTO DEBOLE ESPOSTO',1.3)}}
let rate=(weapon==='machinegun'?.12:weapon==='shotgun'?.55:weapon==='piercing'?.47:.28)/(1+fireBoost);fireTimer+=dt;if(fireTimer>=rate){fireTimer=0;for(let s of soldiers){shootForward(s,0);if(weapon==='shotgun'){shootForward(s,-.11);shootForward(s,.11)}}}
for(const z of zombies){if(!z.alive)continue;z.phase+=dt*(z.variant==='runner'?12:7);let speed=z.variant==='runner'?6.0:z.variant==='heavy'?2.25:3.7;speed*=1+Math.min(.45,(wave-1)*.05);z.r.position.z-=dt*speed;let track=Math.sin(z.phase*.12)*.12+(desiredX-z.r.position.x)*.08;z.r.position.x=clamp(z.r.position.x+track*dt,-4.3,4.3);z.core.position.y=Math.abs(Math.sin(z.phase))*.08;z.core.rotation.z=Math.sin(z.phase*.52)*.065;z.head.rotation.z=Math.sin(z.phase*.65)*.07;
 if(z.hitFlash>0){z.hitFlash=Math.max(0,z.hitFlash-dt);z.core.rotation.x=.12+z.hitFlash*.48;z.core.scaling.setAll(1+z.hitFlash*.34)}
 else{z.core.rotation.x=.12;z.core.scaling.setAll(1)}
 z.legs[0].rotation.x=Math.sin(z.phase)*.35;z.legs[1].rotation.x=-Math.sin(z.phase)*.35;z.arms[0].rotation.x=-1.1+Math.sin(z.phase)*.13;z.arms[1].rotation.x=-1.1-Math.sin(z.phase)*.13;if(z.r.position.z<-2.3){if(Math.abs(z.r.position.x-desiredX)<(soldiers.length>5?2.3:1.55)&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=.45}z.alive=false;z.r.setEnabled(false)}if(z.r.position.z< -8){z.alive=false;z.r.setEnabled(false)}}
// Keep defeated enemies visible briefly: they stagger, topple and sink out of view.
// They are no longer alive, so bullets and gameplay collisions ignore them.
for(const z of zombies){
 if(z.alive||!z.dying)continue;
 z.dying=Math.max(0,z.dying-dt);
 const p=1-z.dying/.72;
 z.core.rotation.z=z.deathSide*p*1.25;
 z.core.rotation.x=.12+p*.34;
 z.core.position.y=-p*p*1.08;
 z.r.position.z-=dt*1.15;
 if(z.dying===0)z.r.setEnabled(false);
}
for(let i=gates.length-1;i>=0;i--){let g=gates[i];g.r.position.z-=dt*spd;
 // Low-cost beacon pulse, with no animated lights or extra draw calls.
 if(g.r.metadata&&g.r.metadata.gateBeacon){let pulse=1+Math.sin(elapsed*4.4+g.choice*1.7)*.20;g.r.metadata.gateBeacon.scaling.setAll(pulse)}
 if(g.r.position.z<=-2.75&&gateChoiceLock<=0){let selected=desiredX<0?0:1;if(g.choice===selected){applyGate(g);break}}if(g.r.position.z< -9){g.r.dispose();gates.splice(i,1)}}
for(const p of gameProps){if(p.dead)continue;p.r.position.z-=dt*spd;if(p.type==='coin'){p.phase+=dt;p.r.rotation.y+=dt*3;p.r.position.y=.60+Math.sin(p.phase*4)*.11}if(p.r.position.z<=-2.8){if(Math.abs(p.r.position.x-desiredX)<(p.type==='coin'?1.25:1.28)){if(p.type==='coin'){coins+=3;flash('+3 MONETE',.8);hud()}else if(p.type==='obstacle'&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=.7}else if(p.type==='barrel')explodeBarrel(p)}p.dead=true;p.r.setEnabled(false)}if(p.r.position.z<-8){p.dead=true;p.r.setEnabled(false)}}
for(let i=shots.length-1;i>=0;i--){
 let p=shots[i],oldX=p.m.position.x,oldZ=p.m.position.z;
 let newX=oldX+p.vx*dt,newZ=oldZ+p.vz*dt;
 let best=null,bestZ=1e9;
 // Swept forward collision: only targets in the actual projectile corridor can be hit.
 // Barrels can also be shot, but no friendly fire.
 const tryHit=(t,radius)=>{
  if(!t||!t.r||t.dead||t.alive===false||!t.r.isEnabled()||p.hit.has(t))return;
  let z=t.r.position.z;
  if(z<oldZ-.40||z>newZ+.40)return;
  let frac=(z-oldZ)/Math.max(.01,newZ-oldZ);
  let atX=oldX+(newX-oldX)*clamp(frac,0,1);
  if(Math.abs(atX-t.r.position.x)<=radius && z<bestZ){best=t;bestZ=z}
 };
 for(const z of zombies)tryHit(z,z.variant==='heavy'?.78:.53);
 if(boss&&boss.alive)tryHit(boss,2.15);
 for(const o of gameProps)if(o.type==='barrel'&&!o.dead)tryHit(o,.58);
 if(best){
  p.hit.add(best);
  if(best.type==='barrel'){impactFx(best.r.position.x,1.0,best.r.position.z,false)}

  if(best.type==='barrel'){best.hp--;if(best.hp<=0)explodeBarrel(best)}
  else hurtZombie(best,p.damage*(best===boss&&chargeTimer<2?1.55:1));
  if(!p.piercing){p.m.dispose();shots.splice(i,1);continue}
 }
 p.m.position.x=newX;p.m.position.z=newZ;
 if(newZ>75){p.m.dispose();shots.splice(i,1)}
}

for(let i=visualFx.length-1;i>=0;i--){
 const fx=visualFx[i];fx.t-=dt;
 if(fx.t<=0){fx.m.dispose();visualFx.splice(i,1);continue}
 const t=1-fx.t/fx.max;
 fx.m.scaling.setAll(1+t*fx.growth);
 if(fx.kind==='pop')fx.m.position.y+=dt*.4;
}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t-=dt;p.m.position.addInPlace(p.v.scale(dt));p.v.y-=dt*12;p.m.scaling.setAll(Math.max(.05,p.t/p.max));if(p.t<=0){p.m.dispose();particles.splice(i,1)}}
for(let i=zombies.length-1;i>=0;i--)if(!zombies[i].alive&&!zombies[i].dying){zombies[i].r.dispose();zombies.splice(i,1)}for(let i=gameProps.length-1;i>=0;i--)if(gameProps[i].dead){gameProps[i].r.dispose();gameProps.splice(i,1)}hud();}
$('pauseBtn').onclick=()=>{if(modalOpen||gameOver)return;paused=!paused;$('pauseBtn').textContent=paused?'RIPRENDI':'PAUSA';if(paused)flash('PAUSA',5);else flash('RIPRENDI',.6)};
$('restartBtn').onclick=()=>openModal('RICOMINCIARE?','La partita attuale verrà azzerata, comprese monete e progressi.',[{label:'ANNULLA',act:()=>{}},{label:'RICOMINCIA',act:startRun}]);
$('skipBtn').onclick=()=>{if(modalOpen||gameOver)return;disposeGroup(zombies);disposeGroup(gates);disposeGroup(gameProps);wave=10;phase='transition';hud();flash('TEST BOSS',.7)};
let touching=false;function movePointer(e){let rect=canvas.getBoundingClientRect();desiredX=clamp(((e.clientX-rect.left)/rect.width-.5)*10.6,-3.8,3.8)}canvas.addEventListener('pointerdown',e=>{touching=true;canvas.setPointerCapture(e.pointerId);movePointer(e)});canvas.addEventListener('pointermove',e=>{if(touching)movePointer(e)});canvas.addEventListener('pointerup',()=>touching=false);canvas.addEventListener('pointercancel',()=>touching=false);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')desiredX=clamp(desiredX-.65,-3.8,3.8);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')desiredX=clamp(desiredX+.65,-3.8,3.8);if(e.key==='Escape'&&!modalOpen)$('pauseBtn').click()});
startRun();document.getElementById('bootStatus').textContent='Partita avviata';
let fpsClock=0,frames=0;
engine.runRenderLoop(()=>{try{
 let dt=Math.min(.045,engine.getDeltaTime()/1000);
 if(!paused&&!modalOpen&&!gameOver)animate(dt);
 scene.render();frames++;
 if(frames===1)document.getElementById('bootStatus').textContent='Scena visibile';
 fpsClock+=dt;
 if(fpsClock>.5){fpsClock=0;$('fps').innerHTML='FPS: <b>'+Math.round(engine.getFps())+'</b>'}
}catch(err){let p=document.getElementById('error');p.style.display='block';p.textContent='Errore durante la partita: '+String(err&&err.message||err);console.error(err);paused=true}});addEventListener('resize',()=>engine.resize());document.addEventListener('visibilitychange',()=>{if(document.hidden&&!modalOpen){paused=true;$('pauseBtn').textContent='RIPRENDI'}});

})()
</script></body></html>
