for(let i=shots.length-1;i>=0;i--){let p=shots[i];if(!p.target.alive||!p.target.r.isEnabled()){p.m.dispose();shots.splice(i,1);continue}let t=p.target.r.position;let destination=new B.Vector3(t.x,p.target===boss?3.66:1.8,t.z-1.05);let dir=destination.subtract(p.m.position);let dist=dir.length();if(dist<dt*p.speed+.30){takeDamage(p.target,p.damage);p.m.dispose();shots.splice(i,1)}else p.m.position.addInPlace(dir.scale(dt*p.speed/dist))}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t-=dt;p.m.position.addInPlace(p.v.scale(dt));p.v.y-=dt*12;p.m.scaling.setAll(Math.max(.01,p.t/.64));if(p.t<=0){p.m.dispose();particles.splice(i,1)}}if(zombies.length>42){let gone=zombies.filter(z=>!z.alive);for(let z of gone)z.r.dispose();zombies=zombies.filter(z=>z.alive)} }
spawnSquad();setMode('crowd');let lastFPS=0,fpsClock=0;engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);if(!paused)animate(dt);scene.render();fpsClock+=dt;if(fpsClock>.5){fpsClock=0;$('fps').innerHTML='FPS: <b>'+Math.round(engine.getFps())+'</b>'}});addEventListener('resize',()=>engine.resize());document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;$('pauseBtn').textContent='RIPRENDI'}});
