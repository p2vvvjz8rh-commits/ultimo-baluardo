function emitParticle(x,y,z,c,count=7){for(let i=0;i<count;i++){let p=box('spark',.10,.10,.10,x,y,z,c);particles.push({m:p,v:new B.Vector3(rnd(-3.5,3.5),rnd(1,5),rnd(-3,3)),t:rnd(.25,.5),max:.5})}}
function spawnZombie(zOverride, forced){if(zombies.filter(a=>a.alive).length>=30)return;let r=Math.random();let variant=forced||(r<.14?'runner':r<.24?'heavy':'normal');let x=rnd(-4.1,4.1),z=makeZombie('enemy'+Math.random(),x,zOverride??rnd(39,49),variant);z.hp=(variant==='heavy'?7:variant==='runner'?2:3)+(level-1)*1.5+Math.floor(wave/4);z.maxhp=z.hp;zombies.push(z)}
function spawnDoorPair(){if(gates.length||phase!=='waves')return;let options=[['+2 SOLDATI','recruit',2,'gategreen'],['+4 SOLDATI','recruit',4,'gategreen'],['×2 SOLDATI','multiply',2,'gategreen'],['+ DANNI','damage',.30,'gateblue'],['+ CADENZA','rate',.25,'gateblue'],['−1 SOLDATO','lose',1,'rust'],['+ MONETE','coins',6,'gateblue'],['− CADENZA','slow',.18,'rust']];let ia=Math.floor(Math.random()*options.length),ib=Math.floor(Math.random()*options.length);while(ib===ia)ib=Math.floor(Math.random()*options.length);let chosen=[options[ia],options[ib]];if(chosen.every(q=>q[1]==='lose'||q[1]==='slow'))chosen[1]=options[0];let pair=++gateSerial;for(let i=0;i<2;i++){let a=chosen[i],g=previewGate(i?2.52:-2.52,47,a[3],a[3]==='gategreen'?glowGreen:a[3]==='rust'?materials.rust:glowBlue,a[0]);g.scaling.set(.98,.92,1);g.metadata={};gates.push({r:g,pair,choice:i,x:i?2.52:-2.52,label:a[0],kind:a[1],val:a[2],triggered:false})}flash('SCEGLI UNA PORTA',.95)}
function applyGate(g){if(g.kind==='recruit'){for(let k=0;k<g.val;k++)spawnSoldier()}if(g.kind==='multiply'){let cnt=Math.min(20-soldiers.length,soldiers.length);for(let k=0;k<cnt;k++)spawnSoldier()}if(g.kind==='damage')damageBoost+=g.val;if(g.kind==='rate')fireBoost+=g.val;if(g.kind==='coins')coins+=g.val;if(g.kind==='lose')removeSoldier();if(g.kind==='slow')fireBoost=Math.max(-.2,fireBoost-g.val);flash(g.label,1.4);gateChoiceLock=1.3;for(let h of gates){h.r.dispose()}gates=[];hud()}
function spawnObstacle(){if(gameProps.filter(o=>o.type==='barrel'||o.type==='obstacle').length>8)return;let side=Math.random()<.5?-1:1,x=side*rnd(2.1,4),isBarrel=Math.random()<.59,z=rnd(43,48);let m=isBarrel?barrel(x,z):barrier(x,z);gameProps.push({r:m,type:isBarrel?'barrel':'obstacle',x,z,hp:isBarrel?2:1,dead:false})}
function spawnCoin(){let x=rnd(-3.8,3.8),z=46;let r=root('pickupCoin',x,.55,z);cyl('gold',.66,.13,0,0,0,'yellow',r,14).rotation.x=Math.PI/2;ball('shine',.30,0,0,-.15,glowYellow,r);gameProps.push({r,type:'coin',x,z,dead:false,phase:0})}
function explodeBarrel(o){if(o.dead)return;o.dead=true;emitParticle(o.r.position.x,1,o.r.position.z,'yellow',26);for(const z of zombies){if(z.alive&&B.Vector3.Distance(z.r.position,o.r.position)<5.6)hurtZombie(z,12)}if(boss&&boss.alive&&B.Vector3.Distance(boss.r.position,o.r.position)<6.4)hurtZombie(boss,18);for(const q of gameProps)if(q!==o&&q.type==='barrel'&&!q.dead&&B.Vector3.Distance(q.r.position,o.r.position)<3.6)explodeBarrel(q);flash('ESPLOSIONE!',.65);o.r.setEnabled(false)}
function hurtZombie(z,dmg){if(!z.alive)return;z.hp-=dmg;emitParticle(z.r.position.x,z===boss?3.2:1.8,z.r.position.z,z===boss?'yellow':'zombie',2);if(z.hp<=0){z.alive=false;z.r.setEnabled(false);if(z===boss){coins+=25;kills++;flash('LO SFONDATORE SCONFITTO!',2);phase='victory';setTimeout(()=>{if(phase==='victory')finishLevel()},1200)}else{coins+=1;kills++}hud()}}
function shootAt(s,target,offset=0){if(!target)return;let m=ball('round',.14,s.r.position.x+.2,1.75,s.r.position.z+1,'yellow');shots.push({m,target,kind:'bullet',speed:37,damage:(1+damageBoost)*(weapon==='shotgun'?.75:weapon==='machinegun'?.72:weapon==='piercing'?1.1:1),t:0,offset})}
function findTarget(x){let all=zombies.filter(z=>z.alive);if(boss&&boss.alive)all.push(boss);for(let p of gameProps)if(p.type==='barrel'&&!p.dead)all.push(p);let best=null,min=1e9;for(let z of all){const v=z.r.position;let distance=Math.abs(v.x-x)*1.8+Math.abs(v.z+3)*.25;if(z===boss)distance-=4;if(z.type==='barrel')distance+=2;if(distance<min){min=distance;best=z}}return best}
function nextWave(){if(wave>=10){phase='transition';spawnTimer=0;flash('PREPARATI AL BOSS!',1.5);return}wave++;waveClock=0;spawnTimer=0;gateTimer=4;hazardTimer=6;flash('ONDATA '+wave+' / 10',1.5);hud()}
function preBoss(){phase='loadout';disposeGroup(gates);openModal('SCEGLI UN’ARMA','Hai completato le 10 ondate! Scegli gratuitamente l’arma per affrontare Lo Sfondatore. La scelta dura fino alla fine del boss.',[
{label:'FUCILE · EQUILIBRATO',act:()=>beginBoss('rifle')},{label:'FUCILE A POMPA · 3 COLPI',act:()=>beginBoss('shotgun')},{label:'MITRAGLIATRICE · RAPIDA',act:()=>beginBoss('machinegun')},{label:'PERFORANTE · POTENTE',act:()=>beginBoss('piercing')}])}
function beginBoss(w){weapon=w;phase='boss';boss=makeBoss();boss.r.position.z=38;boss.hp=130+35*(level-1);boss.maxhp=boss.hp;boss.alive=true;bossTimer=0;chargeTimer=0;hud();flash('LO SFONDATORE!',2);$('hint').textContent='Boss: schiva le cariche! La sua corazza si apre dopo ogni carica.'}
function finishLevel(){phase='shop';disposeGroup(zombies);disposeGroup(gameProps);if(boss){boss.r.dispose();boss=null}let carry=Math.max(1,Math.floor(soldiers.length*.25));openModal('LIVELLO '+level+' COMPLETATO','Hai sconfitto il boss! '+coins+' monete disponibili. Nel prossimo aggiornamento arriverà il negozio completo; per ora conservi le monete e riparti con '+carry+' soldati.',[{label:'LIVELLO SUCCESSIVO',full:true,act:()=>{for(let s of soldiers)s.r.dispose();soldiers=[];level++;wave=1;waveClock=0;spawnTimer=0;gateTimer=3;hazardTimer=6;coinTimer=9;phase='waves';weapon='rifle';damageBoost=0;fireBoost=0;shield=3;desiredX=0;for(let k=0;k<carry;k++)spawnSoldier();hud();flash('LIVELLO '+level,1.4);$('hint').textContent='Nuove ondate · Più zombie · Attraversa le porte'}}])}
function animate(dt){elapsed+=dt;let spd=scrollSpeed*(1+Math.min(.4,(wave-1)*.043));if(phase==='waves'||phase==='transition'){for(const dash of roadDashes){dash.position.z-=spd*dt;if(dash.position.z<-18)dash.position.z+=101.4}}if(flashTime>0){flashTime-=dt;if(flashTime<=0)$('flash').style.opacity='0'}if(gateChoiceLock>0)gateChoiceLock-=dt;positionSquad(dt);
for(let i=0;i<soldiers.length;i++){let s=soldiers[i],t=elapsed*9+i*.4;s.legL.rotation.x=Math.sin(t)*.19;s.legR.rotation.x=-Math.sin(t)*.19;s.body.position.y=Math.abs(Math.sin(t))*.06;s.armL.rotation.z=.05*Math.sin(t)}
if(phase==='waves'){waveClock+=dt;spawnTimer+=dt;gateTimer+=dt;hazardTimer+=dt;coinTimer+=dt;let interval=Math.max(.40,1.26-(wave-1)*.075-(level-1)*.05);if(spawnTimer>interval){spawnTimer=0;spawnZombie()}if(gateTimer>15.5){gateTimer=0;spawnDoorPair()}if(hazardTimer>9.2){hazardTimer=0;spawnObstacle()}if(coinTimer>22){coinTimer=0;spawnCoin()}if(waveClock>=waveDuration){if(wave<10)nextWave();else{phase='transition';flash('ULTIMA ONDATA SUPERATA',1.5)}}}
if(phase==='transition'){if(zombies.some(z=>z.alive)||gates.length||gameProps.some(x=>x.type==='obstacle'&&!x.dead)){// clear the last stragglers by continued movement
}else preBoss()}
if(phase==='boss'&&boss&&boss.alive){bossTimer+=dt;chargeTimer+=dt;boss.phase+=dt;boss.r.position.z-=dt*(chargeTimer>6.5&&chargeTimer<8.0?12:.35);boss.r.position.x+=(desiredX-boss.r.position.x)*Math.min(1,dt*(chargeTimer>6.5?3:.35));boss.core.position.y=Math.sin(bossTimer*3)*.08;for(let [i,a] of boss.arms.entries())a.rotation.z=(i===0?-.17:.17)+Math.sin(bossTimer*2+i)*.12;if(chargeTimer>9){chargeTimer=0;boss.r.position.z=29;flash('CARICA IN ARRIVO!',1.25)}if(chargeTimer>5.3&&chargeTimer<5.36)flash('SCHIVA! CARICA!',.9);if(boss.r.position.z<-1.5){if(Math.abs(boss.r.position.x-desiredX)<2.1&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=1.2}boss.r.position.z=25;chargeTimer=0;flash('PUNTO DEBOLE ESPOSTO',1.3)}}
let rate=(weapon==='machinegun'?.12:weapon==='shotgun'?.55:weapon==='piercing'?.47:.28)/(1+fireBoost);fireTimer+=dt;if(fireTimer>=rate){fireTimer=0;for(let s of soldiers){let t=findTarget(s.r.position.x);if(t){shootAt(s,t);if(weapon==='shotgun'){shootAt(s,t,.45);shootAt(s,t,-.45)}}}}
for(const z of zombies){if(!z.alive)continue;z.phase+=dt*(z.variant==='runner'?12:7);let speed=z.variant==='runner'?6.0:z.variant==='heavy'?2.25:3.7;speed*=1+Math.min(.45,(wave-1)*.05);z.r.position.z-=dt*speed;let track=Math.sin(z.phase*.12)*.12+(desiredX-z.r.position.x)*.08;z.r.position.x=clamp(z.r.position.x+track*dt,-4.3,4.3);z.core.position.y=Math.abs(Math.sin(z.phase))*.08;z.legs[0].rotation.x=Math.sin(z.phase)*.35;z.legs[1].rotation.x=-Math.sin(z.phase)*.35;z.arms[0].rotation.x=-1.1+Math.sin(z.phase)*.13;z.arms[1].rotation.x=-1.1-Math.sin(z.phase)*.13;if(z.r.position.z<-2.3){if(Math.abs(z.r.position.x-desiredX)<(soldiers.length>5?2.3:1.55)&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=.45}z.alive=false;z.r.setEnabled(false)}if(z.r.position.z< -8){z.alive=false;z.r.setEnabled(false)}}
for(let i=gates.length-1;i>=0;i--){let g=gates[i];g.r.position.z-=dt*spd;if(g.r.position.z<=-2.75&&gateChoiceLock<=0){let selected=desiredX<0?0:1;if(g.choice===selected){applyGate(g);break}}if(g.r.position.z< -9){g.r.dispose();gates.splice(i,1)}}
for(const p of gameProps){if(p.dead)continue;p.r.position.z-=dt*spd;if(p.type==='coin'){p.phase+=dt;p.r.rotation.y+=dt*3;p.r.position.y=.60+Math.sin(p.phase*4)*.11}if(p.r.position.z<=-2.8){if(Math.abs(p.r.position.x-desiredX)<(p.type==='coin'?1.25:1.28)){if(p.type==='coin'){coins+=3;flash('+3 MONETE',.8);hud()}else if(p.type==='obstacle'&&gateChoiceLock<=0){removeSoldier();gateChoiceLock=.7}else if(p.type==='barrel')explodeBarrel(p)}p.dead=true;p.r.setEnabled(false)}if(p.r.position.z<-8){p.dead=true;p.r.setEnabled(false)}}
for(let i=shots.length-1;i>=0;i--){let p=shots[i],t=p.target;if(!t||!t.r||t.dead||t.alive===false||!t.r.isEnabled()){p.m.dispose();shots.splice(i,1);continue}let targetPos=new B.Vector3(t.r.position.x+p.offset,t===boss?3.2:(t.type==='barrel'?.7:1.6),t.r.position.z-.5);let delta=targetPos.subtract(p.m.position),dist=delta.length();if(dist<=dt*p.speed+.28){if(t.type==='barrel'){t.hp--;if(t.hp<=0)explodeBarrel(t)}else hurtZombie(t,p.damage*(t===boss&&chargeTimer<2?1.55:1));p.m.dispose();shots.splice(i,1)}else p.m.position.addInPlace(delta.scale(dt*p.speed/dist))}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t-=dt;p.m.position.addInPlace(p.v.scale(dt));p.v.y-=dt*12;p.m.scaling.setAll(Math.max(.05,p.t/p.max));if(p.t<=0){p.m.dispose();particles.splice(i,1)}}
for(let i=zombies.length-1;i>=0;i--)if(!zombies[i].alive){zombies[i].r.dispose();zombies.splice(i,1)}for(let i=gameProps.length-1;i>=0;i--)if(gameProps[i].dead){gameProps[i].r.dispose();gameProps.splice(i,1)}hud();}
$('pauseBtn').onclick=()=>{if(modalOpen||gameOver)return;paused=!paused;$('pauseBtn').textContent=paused?'RIPRENDI':'PAUSA';if(paused)flash('PAUSA',5);else flash('RIPRENDI',.6)};
$('restartBtn').onclick=()=>openModal('RICOMINCIARE?','La partita attuale verrà azzerata, comprese monete e progressi.',[{label:'ANNULLA',act:()=>{}},{label:'RICOMINCIA',act:startRun}]);
$('skipBtn').onclick=()=>{if(modalOpen||gameOver)return;disposeGroup(zombies);disposeGroup(gates);disposeGroup(gameProps);wave=10;phase='transition';hud();flash('TEST BOSS',.7)};
let touching=false;function movePointer(e){let rect=canvas.getBoundingClientRect();desiredX=clamp(((e.clientX-rect.left)/rect.width-.5)*10.6,-3.8,3.8)}canvas.addEventListener('pointerdown',e=>{touching=true;canvas.setPointerCapture(e.pointerId);movePointer(e)});canvas.addEventListener('pointermove',e=>{if(touching)movePointer(e)});canvas.addEventListener('pointerup',()=>touching=false);canvas.addEventListener('pointercancel',()=>touching=false);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')desiredX=clamp(desiredX-.65,-3.8,3.8);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')desiredX=clamp(desiredX+.65,-3.8,3.8);if(e.key==='Escape'&&!modalOpen)$('pauseBtn').click()});
startRun();let fpsClock=0;engine.runRenderLoop(()=>{let dt=Math.min(.045,engine.getDeltaTime()/1000);if(!paused&&!modalOpen&&!gameOver)animate(dt);scene.render();fpsClock+=dt;if(fpsClock>.5){fpsClock=0;$('fps').innerHTML='FPS: <b>'+Math.round(engine.getFps())+'</b>'}});addEventListener('resize',()=>engine.resize());document.addEventListener('visibilitychange',()=>{if(document.hidden&&!modalOpen){paused=true;$('pauseBtn').textContent='RIPRENDI'}});

})()
</script></body></html>
